name: Tests

on:
  push:
    branches: ["main", "m*"]
  pull_request:
    branches: ["main"]

jobs:
  final-agent-deployment:
    name: Final agent deployment binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: final_agent/deploy/agentcore/cdk/package-lock.json
      - name: Stage standalone serving code
        working-directory: final_agent
        run: python deploy/deploy.py --stage-only
      - name: Install required Python bundler
        run: python -m pip install uv
      - name: Verify five-player CDK bindings
        working-directory: final_agent/deploy/agentcore/cdk
        run: npm ci --no-fund --no-audit && npm test

  unit-tests:
    name: Unit tests (Python 3.12)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: local_simulator

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pytest
        run: pip install pytest

      - name: Run unit tests
        run: |
          PYTHONPATH=src pytest tests/ \
            --ignore=tests/test_viewer.py \
            -v --tb=short

  redesign4-tests:
    name: Agent tests (final_agent, Python 3.12)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: final_agent

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test tools
        run: pip install -e ".[offline,dev,learning]"

      - name: Run agent tests
        run: pytest tests/ -v --tb=short

      - name: Lint
        run: |
          ruff check agent tests
          ruff check deploy/learning.py deploy/s3_learning.py

      - name: Type check
        run: mypy

  deploy:
    name: Deploy to AgentCore
    runs-on: ubuntu-latest
    needs: [final-agent-deployment, unit-tests, redesign4-tests]
    # Only deploy on direct push to main, not on PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: final_agent/deploy/agentcore/cdk/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install tools
        run: |
          python -m pip install uv
          npm install -g @aws/agentcore

      - name: Install Python deps
        working-directory: final_agent
        run: pip install -e ".[learning]"

      - name: Deploy all five runtimes
        working-directory: final_agent
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: python deploy/deploy.py
